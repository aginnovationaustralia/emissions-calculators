name: Publish Package

on:
  push:
    tags:
      - 'v*'
      - 'veerg-calculators-v*'
      - 'calculator-units-v*'
      - 'calculator-inputs-v*'
      - 'emissions-calculator-research-v*'

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Configure git to use HTTPS instead of SSH
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
        shell: bash

      - name: Install dependencies
        run: pnpm install
        shell: bash

      - name: Build
        run: pnpm run build
        shell: bash

      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@11
        shell: bash

      - name: Determine release type
        id: release-type
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Tags come from release-please: `<component>-v<version>`, or `v<version>` for calculators
          case "$TAG" in
            veerg-calculators-v*) PACKAGE_DIR=packages/veerg-calculators ;;
            calculator-units-v*) PACKAGE_DIR=packages/calculator-units ;;
            calculator-inputs-v*) PACKAGE_DIR=packages/calculator-inputs ;;
            emissions-calculator-research-v*) PACKAGE_DIR=packages/research ;;
            v*) PACKAGE_DIR=packages/calculators ;;
            *) echo "No package is published for tag $TAG" >&2; exit 1 ;;
          esac
          echo "package_dir=$PACKAGE_DIR" >> $GITHUB_OUTPUT

          if [[ "$TAG" == *"-beta"* ]]; then
            echo "npm_tag=beta" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-rc"* ]]; then
            echo "npm_tag=rc" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-alpha"* ]]; then
            echo "npm_tag=alpha" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # pnpm replaces `workspace:` dependency versions with real ones, which npm publish doesn't.
      # pnpm 9 hands the packed tarball to the npm CLI, so trusted publishing (OIDC) still applies.
      # --no-git-checks: the tag is checked out detached, not on a branch.
      - name: Publish
        run: pnpm publish --tag ${{ steps.release-type.outputs.npm_tag }} --no-git-checks
        working-directory: ${{ steps.release-type.outputs.package_dir }}
        shell: bash

      - name: Summary
        run: |
          echo "### 📦 Published Package" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Package:** ${{ steps.release-type.outputs.package_dir }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.release-type.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **npm tag:** \`${{ steps.release-type.outputs.npm_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Prerelease:** ${{ steps.release-type.outputs.is_prerelease }}" >> $GITHUB_STEP_SUMMARY
