name: 'Build and Test'
description: 'Build, lint, and test the emissions-calculators project'
runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: Configure git to use HTTPS instead of SSH
      run: |
        git config --global url."https://github.com/".insteadOf git@github.com:
      shell: bash

    - name: Check spreadsheets for local file paths
      run: node scripts/strip-xlsx-paths.js --check
      shell: bash

    - name: Install dependencies
      run: pnpm install
      shell: bash

    - name: Build
      run: pnpm run build
      shell: bash

    - name: Install oasdiff
      env:
        OASDIFF_VERSION: 1.35.0
        OASDIFF_SHA256: a8023002fcb2eaa7f5758148a9303cb63d33b939886df312268bc0fc7b939140
      run: |
        archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$archive" \
          "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
        echo "$OASDIFF_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/oasdiff"
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/oasdiff" oasdiff
        echo "$RUNNER_TEMP/oasdiff" >> "$GITHUB_PATH"
      shell: bash

    - name: Check OpenAPI breaking changes
      run: pnpm --filter @aginnovationaustralia/emissions-calculators run check:openapi-breaking
      shell: bash

    - name: Lint
      run: pnpm run lint
      shell: bash

    - name: Test
      run: pnpm run test
      shell: bash
